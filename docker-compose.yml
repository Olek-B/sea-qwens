services:
  neo4j:
    image: neo4j:5.15
    container_name: sea-qwens-neo4j
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/seaqwenspassword
      - NEO4J_PLUGINS=apoc
    volumes:
      - neo4j_data:/data
    networks:
      - sea-qwens-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: ghcr.io/chroma-core/chroma:0.5.23
    container_name: sea-qwens-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - sea-qwens-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  librarian:
    build:
      context: .
      dockerfile: services/librarian/Dockerfile
    container_name: sea-qwens-librarian
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=seaqwenspassword
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000
    volumes:
      - ${SEA_QWENS_CONFIG_DIR:-~/.config/sea-qwens}:/root/.config/sea-qwens
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - sea-qwens-network

  manager:
    build:
      context: .
      dockerfile: services/manager/Dockerfile
    container_name: sea-qwens-manager
    ports:
      - "8006:8006"
    environment:
      - LIBRARIAN_URL=http://librarian:8001
    depends_on:
      librarian:
        condition: service_started
    networks:
      - sea-qwens-network

  atomizer:
    build:
      context: .
      dockerfile: services/atomizer/Dockerfile
    container_name: sea-qwens-atomizer
    ports:
      - "8002:8002"
    environment:
      - LIBRARIAN_URL=http://librarian:8001
    depends_on:
      librarian:
        condition: service_started
    networks:
      - sea-qwens-network

  kanban:
    build:
      context: .
      dockerfile: services/kanban/Dockerfile
    container_name: sea-qwens-kanban
    ports:
      - "8003:8003"
    environment:
      - LIBRARIAN_URL=http://librarian:8001
      - WORKER_URL=http://worker:8004
    depends_on:
      librarian:
        condition: service_started
    networks:
      - sea-qwens-network

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: sea-qwens-worker
    ports:
      - "8004:8004"
    environment:
      - KANBAN_URL=http://kanban:8003
    depends_on:
      kanban:
        condition: service_started
    volumes:
      - ./worktrees:/app/worktrees
      - ${SEA_QWENS_CONFIG_DIR:-~/.config/sea-qwens}/adapters:/app/adapters:ro
      - ~/.qwen:/root/.qwen:ro
      - ~/.qwen-accounts:/root/.qwen-accounts:ro
    networks:
      - sea-qwens-network

  tester:
    build:
      context: .
      dockerfile: services/tester/Dockerfile
    container_name: sea-qwens-tester
    ports:
      - "8005:8005"
    environment:
      - WORKER_URL=http://worker:8004
    depends_on:
      worker:
        condition: service_started
    volumes:
      - ./worktrees:/app/worktrees
    networks:
      - sea-qwens-network

networks:
  sea-qwens-network:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
