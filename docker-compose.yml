version: '3.8'

services:
  neo4j:
    image: neo4j:5.15
    container_name: legion-neo4j
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/legionpassword
      - NEO4J_PLUGINS=apoc
    volumes:
      - neo4j_data:/data
    networks:
      - legion-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.4.22
    container_name: legion-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - legion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  librarian:
    build:
      context: .
      dockerfile: services/librarian/Dockerfile
    container_name: legion-librarian
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=legionpassword
      - CHROMA_HOST=http://chromadb:8000
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - legion-network

  manager:
    build:
      context: .
      dockerfile: services/manager/Dockerfile
    container_name: legion-manager
    ports:
      - "8006:8006"
    environment:
      - LIBRARIAN_URL=http://librarian:8001
    depends_on:
      librarian:
        condition: service_started
    networks:
      - legion-network

  atomizer:
    build:
      context: .
      dockerfile: services/atomizer/Dockerfile
    container_name: legion-atomizer
    ports:
      - "8002:8002"
    environment:
      - LIBRARIAN_URL=http://librarian:8001
    depends_on:
      librarian:
        condition: service_started
    networks:
      - legion-network

  kanban:
    build:
      context: .
      dockerfile: services/kanban/Dockerfile
    container_name: legion-kanban
    ports:
      - "8003:8003"
    environment:
      - LIBRARIAN_URL=http://librarian:8001
    depends_on:
      librarian:
        condition: service_started
    networks:
      - legion-network

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: legion-worker
    ports:
      - "8004:8004"
    environment:
      - KANBAN_URL=http://kanban:8003
    depends_on:
      kanban:
        condition: service_started
    volumes:
      - ./worktrees:/app/worktrees
    networks:
      - legion-network

  tester:
    build:
      context: .
      dockerfile: services/tester/Dockerfile
    container_name: legion-tester
    ports:
      - "8005:8005"
    environment:
      - WORKER_URL=http://worker:8004
    depends_on:
      worker:
        condition: service_started
    volumes:
      - ./worktrees:/app/worktrees
    networks:
      - legion-network

networks:
  legion-network:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
